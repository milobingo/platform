name: Deploy Milo production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main SHA already accepted on staging
        required: true
        type: string
      config_id:
        description: Existing root-approved immutable production configuration
        required: true
        default: 'production-2026-11-15-v1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: milobingo-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Require exact successful CI and the same healthy staging source
        id: gate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/protected-production-root-gate.mjs hosted --profile=infra/production/profile.json
      - name: Validate protected configuration identifier
        env:
          CONFIG_ID: ${{ inputs.config_id }}
        run: '[[ "$CONFIG_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]'

  deploy:
    needs: release-gate
    environment:
      name: production
      url: https://milo.dgwebservices.nl
    runs-on: ["self-hosted","Linux","X64","dg-nxttrack-01","milobingo-production","production"]
    timeout-minutes: 35
    steps:
      # No application checkout, provider secret, database secret or build
      # configuration is exposed to the runner. Root repeats both release gates
      # and requires its own five-check staging acceptance record before build.
      - name: Verify the fixed production runner and installed broker
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = 'dg-nxttrack-01'
          test "$(id -un)" = 'run-mil-prd'
          test "$RUNNER_NAME" = 'dg-nxttrack-01-milobingo-production'
          test -x /usr/local/bin/dg-milobingo-production-protected-deploy
      - name: Build and activate with protected production settings
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CONFIG_ID: ${{ inputs.config_id }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            /opt/node-v24.18.0-linux-x64/bin/node -e 'process.stdout.write(JSON.stringify({githubToken:process.env.GITHUB_TOKEN}))' | /usr/local/bin/dg-milobingo-production-protected-deploy deploy "$RELEASE_SHA" "$RELEASE_ID" "$CONFIG_ID"
            result=$?
            set -e
            if test "$result" = 0; then exit 0; fi
            if test "$result" != 75 || test "$attempt" = 4; then exit "$result"; fi
            sleep "$((attempt * 15))"
          done

  verify-public:
    needs: [release-gate, deploy]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      # The reviewed workflow may be newer than the staging-accepted app.
      # Keep its verifier/profile separate from the exact candidate assets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: production-control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release-gate.outputs.release_sha }}
          path: application-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Verify exact public production release and access boundaries
        working-directory: application-source
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CONFIG_ID: ${{ inputs.config_id }}
        run: node ../production-control/scripts/deploy/protected-production-root-gate.mjs public --profile=../production-control/infra/production/profile.json

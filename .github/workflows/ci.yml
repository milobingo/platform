name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: milo_storage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d milo_storage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      MILO_TEST_DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:5432/milo_storage_test
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate build configuration
        run: pnpm check:config --phase=build
      - name: Lint
        run: pnpm lint
      - name: Prepare digest-capable sudoers parser
        shell: bash
        run: |
          # Ubuntu 26.04 uses sudo-rs by default. Keep that default unchanged;
          # the supported C sudo parser is needed for our mandatory digest policy.
          if ! node tests/helpers/sudoers-toolchain.mjs; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends sudo
          fi
          node tests/helpers/sudoers-toolchain.mjs --github-env
          cat /etc/os-release
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          dpkg-query -W -f='${Package} ${Version}\n' sudo
      - name: Offline contract tests
        env:
          MILO_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test
      - name: Native deployment boundary and rollback checks
        run: python3 -B tests/check-native-deployer.py
      - name: Protected deployment and one-time handoff boundaries
        run: |
          python3 -B tests/check-protected-deployer.py
          python3 -B tests/check-protected-bootstrap.py
          python3 -B tests/check-production-key-intake.py
      - name: Build Next.js
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        run: pnpm test:browser

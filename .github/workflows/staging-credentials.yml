name: Prepare Milo staging bootstrap credentials

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit with successful CI; one-time private host handoff only
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: milobingo-staging
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Require successful own main CI for the exact handoff source
        id: gate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/release-preflight.mjs ci

  prepare:
    needs: release-gate
    environment: staging
    runs-on: [self-hosted, Linux, X64, dg-nxttrack-01, milobingo, staging]
    timeout-minutes: 5
    steps:
      - name: Verify the dedicated runner before receiving credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = dg-nxttrack-01
          test "$(id -un)" = run-mil-stg
          test "$RUNNER_NAME" = dg-nxttrack-01-nxttrack-staging
          test "$GITHUB_WORKSPACE" = /home/run-mil-stg/_work/platform/platform
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-gate.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Write the exclusive private bootstrap handoff without network or database writes
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/deploy/prepare-credentials.mjs

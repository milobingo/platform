name: Deploy Milo staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit with successful CI
        required: true
        type: string
      config_id:
        description: Existing protected VPS configuration identifier
        required: true
        default: staging-2026-11-11-v2
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: milobingo-staging
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Require successful main CI on the exact release
        id: gate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/release-preflight.mjs ci
      - name: Validate protected configuration identifier
        env:
          CONFIG_ID: ${{ inputs.config_id }}
        run: '[[ "$CONFIG_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]'

  deploy:
    needs: release-gate
    environment:
      name: staging
      url: https://milo-staging.dgwebservices.nl
    runs-on: [self-hosted, Linux, X64, dg-nxttrack-01, milobingo, staging]
    timeout-minutes: 35
    steps:
      # App code is downloaded and verified by the root-owned broker, then built
      # as build-mil-stg. The runner never receives database/provider secrets.
      - name: Verify the fixed runner and installed broker
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = dg-nxttrack-01
          test "$(id -un)" = run-mil-stg
          test "$RUNNER_NAME" = dg-nxttrack-01-nxttrack-staging
          test -x /usr/local/bin/dg-milo-deploy
      - name: Build and activate using protected VPS settings
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CONFIG_ID: ${{ inputs.config_id }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            /opt/node-v24.18.0-linux-x64/bin/node -e 'process.stdout.write(JSON.stringify({githubToken:process.env.GITHUB_TOKEN}))' | /usr/local/bin/dg-milo-deploy deploy "$RELEASE_SHA" "$RELEASE_ID" "$CONFIG_ID"
            result=$?
            set -e
            if test "$result" = 0; then exit 0; fi
            if test "$result" != 75 || test "$attempt" = 4; then exit "$result"; fi
            sleep "$((attempt * 15))"
          done

  verify-public:
    needs: [release-gate, deploy]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release-gate.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Check exact public release and access boundaries
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CONFIG_VERSION: ${{ inputs.config_id }}
        run: node scripts/deploy/release-preflight.mjs verify

name: Upgrade Milo staging database to v70

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit with successful CI; separately reviewed 18-to-23 upgrade
        required: true
        type: string

      inventory_only:
        description: Read only source metadata and verify the empty restore endpoint; no migration
        required: true
        default: true
        type: boolean
      baseline_manifest_sha256:
        description: Independently reviewed original 18-table manifest SHA-256
        required: true
        type: string
      target_manifest_sha256:
        description: Independently reviewed complete 23-table v70 manifest SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: milobingo-staging
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Require successful own main CI for the exact audit source
        id: gate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/release-preflight.mjs ci

  apply:
    needs: release-gate
    environment: staging
    runs-on: [self-hosted, Linux, X64, dg-nxttrack-01, milobingo, staging]
    timeout-minutes: 30
    steps:
      - name: Verify the dedicated staging runner before receiving credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = dg-nxttrack-01
          test "$(id -un)" = run-mil-stg
          test "$RUNNER_NAME" = dg-nxttrack-01-nxttrack-staging
          test "$GITHUB_WORKSPACE" = /home/run-mil-stg/_work/platform/platform
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-gate.outputs.release_sha }}
          persist-credentials: false
      # Diagnostic tools in the runner cache only. This does not install the
      # root-controlled native release toolchain or start an application.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Install locked dependencies without project credentials
        shell: bash
        run: env -i HOME="$HOME" PATH="$PATH" CI=true pnpm install --frozen-lockfile
      - name: Start dedicated loopback restore relay for this job
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/staging-restore-relay.mjs runner > "$RUNNER_TEMP/milo-v70-restore-relay.log" 2>&1 &
          relay_pid=$!
          printf '%s' "$relay_pid" > "$RUNNER_TEMP/milo-v70-restore-relay.pid"
          for ((attempt=0;attempt<30;attempt++)); do
            if test -f "$RUNNER_TEMP/milo-v70-restore-relay.log" && grep -q '"event":"ready"' "$RUNNER_TEMP/milo-v70-restore-relay.log"; then exit 0; fi
            if ! kill -0 "$relay_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          kill "$relay_pid" 2>/dev/null || true
          exit 1
      - name: Read source inventory and verify the independent empty restore endpoint
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_DB_CA_BASE64: ${{ vars.SUPABASE_DB_CA_BASE64 }}
          RESTORE_TEST_DATABASE_URL: ${{ secrets.RESTORE_TEST_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RESTORE_TEST_DATABASE_URL"
          node scripts/deploy/staging-v70-inventory.mjs
      - name: Mark this run's new backup files without copying earlier backups
        if: ${{ !inputs.inventory_only }}
        shell: bash
        run: touch "$RUNNER_TEMP/milo-v70-backup-start"
      - name: Apply v70 upgrade only after exact baseline audit, encrypted backup and actual restore proof
        if: ${{ !inputs.inventory_only }}
        env:
          RELEASE_SHA: ${{ needs.release-gate.outputs.release_sha }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_DB_CA_BASE64: ${{ vars.SUPABASE_DB_CA_BASE64 }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          RESTORE_TEST_DATABASE_URL: ${{ secrets.RESTORE_TEST_DATABASE_URL }}
          DATABASE_BACKUP_DIRECTORY: /var/backups/milobingo-staging
          REVIEWED_BASELINE_MANIFEST_SHA256: ${{ inputs.baseline_manifest_sha256 }}
          REVIEWED_TARGET_MANIFEST_SHA256: ${{ inputs.target_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy/upgrade-v70.mjs --expected-project-ref=lfsdgxcpdyghidzkzzvn --apply-reviewed-v70 "--reviewed-baseline-manifest-sha256=$REVIEWED_BASELINE_MANIFEST_SHA256" "--reviewed-manifest-sha256=$REVIEWED_TARGET_MANIFEST_SHA256" | tee staging-v70-upgrade.json
      - name: Verify existing least privilege runtime against the upgraded schema
        if: ${{ !inputs.inventory_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_CA_BASE64: ${{ vars.SUPABASE_DB_CA_BASE64 }}
        run: node --input-type=module -e "import {verifyRuntimeDatabase} from './scripts/deploy/release-preflight.mjs'; await verifyRuntimeDatabase(process.env.DATABASE_URL,{caBase64:process.env.SUPABASE_DB_CA_BASE64});"
      - name: Collect only encrypted backups and proofs created by this run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -p staging-v70-database-evidence
          if test -f "$RUNNER_TEMP/milo-v70-backup-start"; then
            find /var/backups/milobingo-staging -maxdepth 1 -type f -newer "$RUNNER_TEMP/milo-v70-backup-start" \( -name '*.dump.aesgcm' -o -name '*.extensions.json.aesgcm' -o -name '*.proof.json' \) -exec cp -- '{}' staging-v70-database-evidence/ \;
            rm "$RUNNER_TEMP/milo-v70-backup-start"
          fi
      - name: Preserve encrypted backups and sanitized restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: milobingo-v70-database-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            staging-v70-inventory.json
            staging-v70-upgrade.json
            staging-v70-database-evidence/
      - name: Stop only this job's relay
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/milo-v70-restore-relay.pid"; then
            relay_pid=$(cat "$RUNNER_TEMP/milo-v70-restore-relay.pid")
            if [[ "$relay_pid" =~ ^[0-9]+$ ]] && test -r "/proc/$relay_pid/cmdline" && tr '\0' ' ' < "/proc/$relay_pid/cmdline" | grep -q 'node scripts/deploy/staging-restore-relay.mjs runner'; then
              kill "$relay_pid"
            fi
            rm "$RUNNER_TEMP/milo-v70-restore-relay.pid"
          fi
